<div class="page">
  <div class="stars" aria-hidden="true"></div>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>
  <div class="spotlight" #spot aria-hidden="true"></div>

  <app-navbar></app-navbar>

  <!-- Side rails (desktop only) -->
  <div class="rail rail-left mono">
    <a [href]="profile.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">in</a>
    <a [href]="profile.github" target="_blank" rel="noopener" aria-label="GitHub">gh</a>
    <span class="rail-line"></span>
  </div>
  <div class="rail rail-right mono">
    <a [href]="'mailto:' + profile.email" class="rail-email">{{ profile.email }}</a>
    <span class="rail-line"></span>
  </div>

  <main>
    <app-main></app-main>
  </main>
</div>
