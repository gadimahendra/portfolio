<div class="scroll-progress" aria-hidden="true">
  <span [style.transform]="'scaleX(' + progress() + ')'"></span>
</div>

<button type="button" class="to-top" [class.show]="progress() > 0.08" (click)="toTop()" aria-label="Back to top">
  <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
    <circle cx="24" cy="24" r="20" class="ring-bg" />
    <circle cx="24" cy="24" r="20" class="ring-fg" [attr.stroke-dasharray]="ring"
      [attr.stroke-dashoffset]="ring * (1 - progress())" />
    <path d="M24 30V18m0 0-5 5m5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</button>

<header class="nav" [class.scrolled]="scrolled()">
  <div class="nav-inner container">
    <button type="button" class="brand" (click)="go('home')" aria-label="Back to top">
      MAHENDRA<span>.</span>
    </button>

    <nav class="links" [class.open]="menuOpen()" aria-label="Primary">
      @for (l of links; track l.id) {
        <button type="button" class="link" [class.active]="active() === l.id" (click)="go(l.id)">{{ l.label }}</button>
      }
      <a class="btn btn-primary btn-sm" [href]="profile.resume" download>Resume</a>
    </nav>

    <button type="button" class="burger" [class.open]="menuOpen()" (click)="menuOpen.set(!menuOpen())"
      [attr.aria-expanded]="menuOpen()" aria-label="Toggle menu">
      <span></span><span></span>
    </button>
  </div>
</header>
